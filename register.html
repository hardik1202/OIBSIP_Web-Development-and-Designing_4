<!DOCTYPE html>
<html>
<head>
    <title>Register - My App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p style="color: #718096; margin-bottom: 25px; font-size: 14px;">Join us today! Please fill in your details.</p>
        
        <!-- This paragraph will show our error or success messages from JavaScript -->
        <p id="registerMessage"></p>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        
        <a href="login.html" class="link">Already have an account? Sign in</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
